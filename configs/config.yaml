project:
  name: RetailIQ
  random_state: 42

data:
  dataset_name: Online Shoppers Purchasing Intention
  target: Revenue
  test_size: 0.20
  validation_size: 0.20

experiments:
  rf_baseline:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: null
    n_jobs: -1
    random_state: 42

  rf_balanced:
    n_estimators: 200
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: balanced
    n_jobs: -1
    random_state: 42

  rf_depth_10:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 2
    class_weight: balanced
    n_jobs: -1
    random_state: 42

  rf_depth_15:
    n_estimators: 300
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 3
    class_weight: balanced
    n_jobs: -1
    random_state: 42

  rf_final:
    n_estimators: 300
    max_depth: 12
    min_samples_split: 2
    min_samples_leaf: 5
    class_weight: balanced
    n_jobs: -1
    random_state: 42

mlflow:
  experiment_name: RetailIQ_Purchase_Prediction
  tracking_uri: sqlite:///retailiq_mlflow.db
